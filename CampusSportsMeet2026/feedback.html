<!DOCTYPE html>
<html>
<head>
    <title>Sports Meet Feedback Form</title>
<nav>
<a href="index.html">Back to home Page</a>
</nav>

</head>
<body>
<style>

input,select{
margin:auto;
text-align:center;
border:2px solid black;
border-radius:5px;
padding:20px;

}
</style>

    <h1 align="center">Sports Meet Feedback Form</h1>
    <form onsubmit="return validateForm()">

        <label>Student Name</label><br>
        <input type="text" id="sname">
        <br><br>
        <label>Register Number</label><br>
        <input type="text" id="regno">
        <br><br>
        <label>Event Attended</label><br>
        <select id="event">
            <option value="">Select Event</option>
            <option>Football</option>
            <option>Cricket</option>
            <option>Volleyball</option>
            <option>Badminton</option>
            <option>Athletics</option>
        </select>
        <br><br>
        <label>Rating</label><br>
        <input type="radio" name="rate" value="1">1
        <input type="radio" name="rate" value="2">2
        <input type="radio" name="rate" value="3">3
        <input type="radio" name="rate" value="4">4
        <input type="radio" name="rate" value="5">5
        <br><br>
        <label>Comments</label><br>
        <textarea id="comment" rows="5" cols="40"></textarea>
        <br><br>
        <input type="submit" value="Submit Feedback">
    </form>
    <script>
        function validateForm()
        {
            var reg = document.getElementById("regno").value;
            var event = document.getElementById("event").value;
            var comment = document.getElementById("comment").value;
            if(reg=="")
            {
                alert("Enter Register Number");
                return false;
            }

            if(event=="")
            {
                alert("Select Event");
                return false;
            }

            var rating = document.getElementsByName("rate");
            var check = false;

            for(var i=0; i<rating.length; i++)
            {
                if(rating[i].checked)
                {
                    check = true;
                }
            }

            if(check==false)
            {
                alert("Select Rating");
                return false;
            }

            if(comment.length < 20)
            {
                alert("Comments should be minimum 20 characters");
                return false;
            }
            alert("Feedback Submitted");
            return true;
        }
    </script>

</body>
</html>
